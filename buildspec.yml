version: 0.2

env:
  parameter-store:
    SONAR_TOKEN: "SonarQube_password"
    DOCKER_USERNAME: "/docker-credentials/username"
    DOCKER_PASSWORD: "/docker-credentials/password"
    DOCKER_URL: "/docker-registry/url"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing SonarScanner"
      - curl -fsSL https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.1.0.6389-linux-x64.zip -o /tmp/sonar-scanner.zip
      - unzip -q /tmp/sonar-scanner.zip -d /opt
      - ln -sfn /opt/sonar-scanner-8.1.0.6389-linux-x64/bin/sonar-scanner /usr/local/bin/sonar-scanner

  pre_build:
    commands:
      - cd "$CODEBUILD_SRC_DIR_SourceArtifact" && npm ci
      - echo "$DOCKER_PASSWORD" | docker login "$DOCKER_URL" -u "$DOCKER_USERNAME" --password-stdin

  build:
    commands:
      - cd "$CODEBUILD_SRC_DIR_SourceArtifact" && sonar-scanner -Dsonar.projectKey=Lakshmankadali_FoodZone -Dsonar.organization=lakshmankadali-2 -Dsonar.sources=src
      - cd "$CODEBUILD_SRC_DIR_SourceArtifact" && npm run build
      - |
        set -e

        if [ -z "${FOODZONE_COMMIT_SHA:-}" ]; then
          echo "ERROR: FOODZONE_COMMIT_SHA was not provided by CodePipeline."
          exit 1
        fi

        BUILD_DATE=$(date -u +%Y%m%d-%H%M%S)
        COMMIT_SHA="${FOODZONE_COMMIT_SHA:0:12}"
        IMAGE_TAG="${BUILD_DATE}-${COMMIT_SHA}"
        IMAGE_NAME="$DOCKER_USERNAME/foodzone"

        docker build \
          -f "$CODEBUILD_SRC_DIR/Dockerfile" \
          -t "$IMAGE_NAME:$IMAGE_TAG" \
          "$CODEBUILD_SRC_DIR_SourceArtifact"

        docker push "$IMAGE_NAME:$IMAGE_TAG"

        echo "Published image: $IMAGE_NAME:$IMAGE_TAG"
