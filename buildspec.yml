version: 0.2

env:
  parameter-store:
    SONAR_TOKEN: "SonarQube_password"
    SONAR_HOST_URL: "Sonar_URL"
    
phases:
  install:
    runtime-versions:
      nodejs: 20

  pre_build:
    commands:
      - cd "$CODEBUILD_SRC_DIR_foodzone" && npm ci

  build:
    commands:
      - cd "$CODEBUILD_SRC_DIR_foodzone" && npm run build
      - echo "FoodZone build completed"

