
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20

  pre_build:
    commands:
      - cd "$CODEBUILD_SRC_DIR_foodzone" && npm ci

  build:
    commands:
      - cd "$CODEBUILD_SRC_DIR_foodzone" && npm run lint
      - cd "$CODEBUILD_SRC_DIR_foodzone" && npm run build
      - echo "FoodZone build completed"

